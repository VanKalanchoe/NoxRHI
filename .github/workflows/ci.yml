name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [ Debug, Release ]

    steps:
      - name: Checkout NoxRHI
        uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: noxrhi-vcpkg-${{ runner.os }}-x64-v1

      - name: Install Core Dependencies (D3D12MA, Slang, ImGui, SDL3, stb)
        shell: cmd
        run: |
          if not exist vendors mkdir vendors
          git clone --depth 1 --branch v3.1.0 https://github.com/GPUOpen-LibrariesAndSDKs/D3D12MemoryAllocator.git vendors\D3D12MemoryAllocator
          curl -fSL https://github.com/shader-slang/slang/releases/download/v2026.22.1/slang-2026.22.1-windows-x86_64.zip -o "%TEMP%\slang.zip"
          mkdir vendors\slang
          tar -xf "%TEMP%\slang.zip" -C vendors\slang
          git clone --depth 1 --branch docking https://github.com/ocornut/imgui.git vendors\imgui
          if not exist "%TEMP%\vcpkg-cache" mkdir "%TEMP%\vcpkg-cache"
          set "VCPKG_BINARY_SOURCES=clear;files,%TEMP%\vcpkg-cache,readwrite"
          "%VCPKG_INSTALLATION_ROOT%\vcpkg.exe" install sdl3 stb --triplet=x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake -S . -B build -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            -DNRI_ENABLE_VULKAN=OFF `
            -DNRI_ENABLE_D3D12=ON `
            -DNRI_ENABLE_NONE=ON `
            -DNRI_ENABLE_SLANG=ON `
            -DNRI_ENABLE_STREAMLINE=OFF `
            -DNRI_ENABLE_NRD=OFF `
            -DNRI_BUILD_EXAMPLES=ON

      - name: Build (${{ matrix.config }})
        shell: pwsh
        run: |
          cmake --build build --config ${{ matrix.config }} --parallel

      - name: Run Headless Smoke Tests (NRI_GRAPHICS_API_NONE)
        shell: pwsh
        run: |
          ./build/${{ matrix.config }}/HeadlessNone.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/${{ matrix.config }}/HeadlessRender.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ShaderCompat on real D3D12: Microsoft's software adapter (WARP), with the DXC release that compiles Slang's DXIL beside it.
      - name: Run ShaderCompat on D3D12 (WARP)
        shell: pwsh
        env:
          NOXRHI_D3D12_WARP: "1"
        run: |
          curl.exe -fSL https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.8.2505.1/dxc_2025_07_14.zip -o "$env:TEMP\dxc.zip"
          Expand-Archive "$env:TEMP\dxc.zip" "$env:TEMP\dxc" -Force
          Copy-Item "$env:TEMP\dxc\bin\x64\dxcompiler.dll", "$env:TEMP\dxc\bin\x64\dxil.dll" ./build/${{ matrix.config }}/
          Push-Location ./build/${{ matrix.config }}
          ./ShaderCompat.exe --dx12 --verbose
          $code = $LASTEXITCODE
          Write-Host ("ShaderCompat exit code: {0} (0x{0:X8})" -f $code)
          Pop-Location
          if ($code -ne 0) { exit $code }

      # The windowed cross-API examples on D3D12 (WARP, debug layer on in Debug): 30 frames each; a D3D12, NoxRHI or render-graph
      # error fails the step. (Vulkan needs a GPU driver with VK_EXT_descriptor_heap: run them with --vk on a real machine.)
      - name: Run cross-API examples on D3D12 (WARP)
        shell: pwsh
        env:
          NOXRHI_D3D12_WARP: "1"
          NOXRHI_D3D12_DRED: "1"
        run: |
          Push-Location ./build/${{ matrix.config }}
          $failed = 0
          Write-Host "=== BindlessScene --probe ==="
          ./BindlessScene.exe --dx12 --frames 5 --probe
          foreach ($example in 'GpuParticles', 'BindlessScene', 'MeshletCulling', 'RayQueryShadows', 'PathTracer') {
            Write-Host "=== $example ==="
            & "./$example.exe" --dx12 --frames 30
            $code = $LASTEXITCODE
            if ($code -ne 0) { Write-Host ("$example exit code: {0} (0x{0:X8})" -f $code); $failed = 1 }
          }
          # MeshletCulling's indirect draw (ExecuteIndirect with a DispatchMesh signature) and the shader checks (--shader-checks: the host's
          # self-test of the report, then the mesh shader's NoxIndex / NOX_CHECK; a reported failure is an error, so the exit code fails).
          foreach ($options in @('--indirect'), @('--shader-checks'), @('--indirect', '--shader-checks')) {
            Write-Host "=== MeshletCulling $options ==="
            & ./MeshletCulling.exe --dx12 --frames 30 @options
            $code = $LASTEXITCODE
            if ($code -ne 0) { Write-Host ("MeshletCulling $options exit code: {0} (0x{0:X8})" -f $code); $failed = 1 }
          }
          # PathTracer (CI builds without NRD / Streamline): the reference and noisy images with the probe (their averages: not black),
          # a guide view, and the shader checks.
          foreach ($options in @('--probe'), @('--mode', 'noisy', '--probe'), @('--guide', '1'), @('--shader-checks'), @('--watch')) {
            Write-Host "=== PathTracer $options ==="
            & ./PathTracer.exe --dx12 --frames 12 @options
            $code = $LASTEXITCODE
            if ($code -ne 0) { Write-Host ("PathTracer $options exit code: {0} (0x{0:X8})" -f $code); $failed = 1 }
          }
          Pop-Location
          exit $failed
